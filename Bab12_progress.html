<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>
    <!--Progres Dasar-->
    <div class="progress">
        <div class="progress-bar" style="width: 40%"></div>
    </div>

    <div class="progrress">
        <div class="progress-bar" style="width: 60%">60%</div>
    </div>

    <br>

    <!--Warna Progress-->
    <div class="progress mb-2">

    </div>

    <div class="progress">
        <div class="progress-bar bg-danger" style="width: 30%">30%</div>
    </div>

    <br> 

    <!--Progress Bergaris & Animasi-->
    <div class="progress">
        <div 
        class="progress-bar progress-bar-striped progress-bar-animated"
        style="width: 70%"
        >
        Loading...
    </div>
    </div>

    <br>

    <div class="progrerss">
        <div class="progrers-bar bg-success" style="width: 40%">40%</div>
        <br>
        <div class="progrers-bar bg-warning" style="width: 30%">30%</div>
        <br>
        <div class="progrers-bar bg-danger" style="width: 20%">20%</div>
        <br>
    </div>

    <br>

    <div class="container mt-4">
        <h1 class="display-4">
            Belajar Bootstrap <span class="badge bg-info">New</span>
        </h1>

        <p class="lead">Bootstrap memudakan</p>

        <h4>Status Belajar</h4>
        <div class="progres mb-3">
            <div class="progress-bar bg-success" style="width: 75%">75%</div>
        </div>

        <buton class="btn btn-primary">
            Tugas<span class="badge bg-light text-dark">2</span>
        </buton>

</body>
